services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulsemetrics
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_local}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulsemetrics"]
      interval: 5s
      timeout: 3s
      retries: 15

  dashboard:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pulse:${POSTGRES_PASSWORD:-pulse_local}@postgres:5432/pulsemetrics
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      postgres: {condition: service_healthy}

  refresh:
    build: .
    profiles: ["jobs"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pulse:${POSTGRES_PASSWORD:-pulse_local}@postgres:5432/pulsemetrics
      DBT_HOST: postgres
      DBT_PASSWORD: ${POSTGRES_PASSWORD:-pulse_local}
    command: ["sh", "-c", "python -m pulsemetrics.pipeline"]
    volumes:
      - ./data/generated:/app/data/generated
    depends_on:
      postgres: {condition: service_healthy}

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    profiles: ["orchestration"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pulse:${POSTGRES_PASSWORD:-pulse_local}@postgres:5432/pulsemetrics
      DBT_HOST: postgres
      DBT_PASSWORD: ${POSTGRES_PASSWORD:-pulse_local}
      PULSE_DATA_DIR: /opt/airflow/pulsemetrics/data/generated
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/metadata/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/pulsemetrics/dags
    command: ["bash", "-c", "airflow db migrate && airflow scheduler"]
    volumes:
      - ./data/generated:/opt/airflow/pulsemetrics/data/generated
      - airflow_state:/opt/airflow/metadata
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  postgres_data:
  airflow_state:
